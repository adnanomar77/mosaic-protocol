[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-protocol"
version = "0.2.0"
description = "MOSAIC: a state-transition-centric distributed ledger protocol prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]
license = { file = "LICENSE" }
authors = [{ name = "Adnan Omar Awad Allemon" }]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mosaic*", "ccd_nexus*"]
